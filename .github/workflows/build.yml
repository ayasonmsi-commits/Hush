name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir src && unzip -o .github/workflows/hush.zip -d src
          echo "PROJ=$(dirname $(find src -name settings.gradle.kts | head -1))" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Hush-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
